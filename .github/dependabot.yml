version: 2
updates:
  - package-ecosystem: cargo
    directory: /tauri-app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri*"
      leptos:
        patterns:
          - "leptos*"

  - package-ecosystem: cargo
    directory: /tauri-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # mediapipe 1.0.1 crashed gains-vision at runtime (#51, #64); later 1.x
      # releases are untested on hardware. pyproject caps the vision extra below
      # 1.0. Re-test on real hardware before lifting either.
      - dependency-name: "mediapipe"
        versions: [">=1.0.0"]

  # NOTE: there is deliberately no npm ecosystem here. tauri-app is a Trunk +
  # Leptos (Rust/wasm) frontend with no package.json, so an npm entry produced a
  # permanently failing weekly run ("Error during file fetching; aborting:
  # /tauri-app/package.json not found"). tests/test_dependabot_config.py keeps
  # every entry pointed at a manifest that actually exists.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
